add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanjia.ir; media-src 'self' blob: https://cdn.sanjia.ir https://*.arvanstorage.ir https://*.sanjia.ir; connect-src 'self' https://api.sanjia.ir https://cdn.sanjia.ir https://payment.zarinpal.com https://sandbox.zarinpal.com; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
