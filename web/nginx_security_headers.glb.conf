add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.mockza.com; media-src 'self' blob: https://cdn.mockza.com https://*.s3.amazonaws.com https://*.r2.cloudflarestorage.com; connect-src 'self' https://api.mockza.com https://cdn.mockza.com https://accounts.google.com https://appleid.apple.com; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
