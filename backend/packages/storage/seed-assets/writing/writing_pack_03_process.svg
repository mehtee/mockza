<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" style="background:#0c0f19;font-family:Inter,system-ui,sans-serif">
  <title>Biochar Production and Wastewater Filtration Process</title>
  <text x="40" y="42" fill="#fff" font-size="20" font-weight="700">Biochar Production &amp; Wastewater Filtration Process</text>
  <rect x="40" y="130" width="150" height="84" rx="10" fill="#172033" stroke="#66dbb5" stroke-width="2"/>
  <text x="115" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">1. Agricultural Waste</text>
  <text x="115" y="188" fill="#9fb0c7" font-size="11" text-anchor="middle">Drying &amp; shredding</text>
  <line x1="190" y1="172" x2="235" y2="172" stroke="#70beff" stroke-width="2.5"/>
  <rect x="235" y="130" width="160" height="84" rx="10" fill="#172033" stroke="#9580ff" stroke-width="2"/>
  <text x="315" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">2. Pyrolysis Reactor</text>
  <text x="315" y="188" fill="#9fb0c7" font-size="11" text-anchor="middle">450–550°C, oxygen-free</text>
  <line x1="395" y1="172" x2="440" y2="172" stroke="#70beff" stroke-width="2.5"/>
  <rect x="440" y="130" width="150" height="84" rx="10" fill="#172033" stroke="#70beff" stroke-width="2"/>
  <text x="515" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">3. Porous Biochar</text>
  <text x="515" y="188" fill="#9fb0c7" font-size="11" text-anchor="middle">Activated filter bed</text>
  <line x1="590" y1="172" x2="635" y2="172" stroke="#66dbb5" stroke-width="2.5"/>
  <rect x="635" y="130" width="130" height="84" rx="10" fill="#172033" stroke="#66dbb5" stroke-width="2"/>
  <text x="700" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">4. Clean Effluent</text>
  <text x="700" y="188" fill="#9fb0c7" font-size="11" text-anchor="middle">94% toxin removal</text>
  <text x="40" y="295" fill="#9fb0c7" font-size="13">By-product syngas &amp; bio-oil captured at Stage 2 supply process heat for Stage 1 feedstock drying.</text>
</svg>