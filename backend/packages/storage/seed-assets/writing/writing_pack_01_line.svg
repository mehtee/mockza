<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" style="background:#0c0f19;font-family:Inter,system-ui,sans-serif">
  <title>Global Water Desalination Capacity (2000-2024)</title>
  <text x="40" y="42" fill="#fff" font-size="20" font-weight="700">Global Water Desalination Capacity (2000–2024)</text>
  <text x="40" y="66" fill="#9580ff" font-size="13">Million Cubic Meters per Day (MCM/d)</text>
  <line x1="90" y1="360" x2="740" y2="360" stroke="#70beff" stroke-width="2"/>
  <line x1="90" y1="100" x2="90" y2="360" stroke="#70beff" stroke-width="2"/>
  <line x1="90" y1="273" x2="740" y2="273" stroke="#1e2438" stroke-dasharray="4"/><text x="78" y="278" fill="#9fb0c7" font-size="11" text-anchor="end">40</text>
  <line x1="90" y1="186" x2="740" y2="186" stroke="#1e2438" stroke-dasharray="4"/><text x="78" y="191" fill="#9fb0c7" font-size="11" text-anchor="end">80</text>
  <line x1="90" y1="100" x2="740" y2="100" stroke="#1e2438" stroke-dasharray="4"/><text x="78" y="105" fill="#9fb0c7" font-size="11" text-anchor="end">120</text>
  <polyline fill="none" stroke="#66dbb5" stroke-width="4" points="90,310 220,285 350,248 480,198 610,148 740,108"/>
  <polyline fill="none" stroke="#9580ff" stroke-width="3" stroke-dasharray="6,4" points="90,328 220,315 350,295 480,262 610,235 740,206"/>
  <text x="90" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2000</text>
  <text x="220" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2005</text>
  <text x="350" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2010</text>
  <text x="480" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2015</text>
  <text x="610" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2020</text>
  <text x="740" y="384" fill="#d7e1ef" font-size="12" text-anchor="middle">2024</text>
  <rect x="440" y="30" width="14" height="14" fill="#66dbb5" rx="3"/><text x="460" y="42" fill="#fff" font-size="12">Total Global Capacity</text>
  <rect x="610" y="30" width="14" height="14" fill="#9580ff" rx="3"/><text x="630" y="42" fill="#fff" font-size="12">Reverse Osmosis Share</text>
</svg>