<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #0c0f19; font-family: 'Inter', system-ui, sans-serif;">
  <title>Renewable Electricity Generation by Source (2010 vs 2025)</title>
  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#ffffff" font-size="20" font-weight="700">Renewable Electricity Generation by Source (2010 vs 2025)</text>
  <text x="40" y="70" fill="#9580ff" font-size="13" font-weight="500">Selected European Countries (Terawatt-hours, TWh) — Mockza Clean-Room Dataset</text>

  <!-- Grid lines -->
  <line x1="100" y1="110" x2="740" y2="110" stroke="#191d2d" stroke-dasharray="4"/>
  <text x="80" y="115" fill="#70beff" font-size="11" text-anchor="end">150</text>

  <line x1="100" y1="180" x2="740" y2="180" stroke="#191d2d" stroke-dasharray="4"/>
  <text x="80" y="185" fill="#70beff" font-size="11" text-anchor="end">100</text>

  <line x1="100" y1="250" x2="740" y2="250" stroke="#191d2d" stroke-dasharray="4"/>
  <text x="80" y="255" fill="#70beff" font-size="11" text-anchor="end">50</text>

  <line x1="100" y1="320" x2="740" y2="320" stroke="#191d2d" stroke-dasharray="4"/>
  <text x="80" y="325" fill="#70beff" font-size="11" text-anchor="end">0</text>

  <!-- Baseline axis -->
  <line x1="100" y1="320" x2="740" y2="320" stroke="#70beff" stroke-width="2"/>

  <!-- Country 1: Germany (2010: 42 TWh, 2025: 142 TWh) -->
  <rect x="140" y="261" width="40" height="59" rx="4" fill="#66dbb5" opacity="0.85"/>
  <text x="160" y="253" fill="#66dbb5" font-size="11" font-weight="600" text-anchor="middle">42</text>
  <rect x="185" y="121" width="40" height="199" rx="4" fill="#9580ff" opacity="0.95"/>
  <text x="205" y="113" fill="#9580ff" font-size="11" font-weight="600" text-anchor="middle">142</text>
  <text x="182" y="348" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Germany</text>

  <!-- Country 2: United Kingdom (2010: 26 TWh, 2025: 118 TWh) -->
  <rect x="290" y="284" width="40" height="36" rx="4" fill="#66dbb5" opacity="0.85"/>
  <text x="310" y="276" fill="#66dbb5" font-size="11" font-weight="600" text-anchor="middle">26</text>
  <rect x="335" y="155" width="40" height="165" rx="4" fill="#9580ff" opacity="0.95"/>
  <text x="355" y="147" fill="#9580ff" font-size="11" font-weight="600" text-anchor="middle">118</text>
  <text x="332" y="348" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">United Kingdom</text>

  <!-- Country 3: Spain (2010: 64 TWh, 2025: 125 TWh) -->
  <rect x="440" y="230" width="40" height="90" rx="4" fill="#66dbb5" opacity="0.85"/>
  <text x="460" y="222" fill="#66dbb5" font-size="11" font-weight="600" text-anchor="middle">64</text>
  <rect x="485" y="145" width="40" height="175" rx="4" fill="#9580ff" opacity="0.95"/>
  <text x="505" y="137" fill="#9580ff" font-size="11" font-weight="600" text-anchor="middle">125</text>
  <text x="482" y="348" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Spain</text>

  <!-- Country 4: Sweden (2010: 48 TWh, 2025: 78 TWh) -->
  <rect x="590" y="253" width="40" height="67" rx="4" fill="#66dbb5" opacity="0.85"/>
  <text x="610" y="245" fill="#66dbb5" font-size="11" font-weight="600" text-anchor="middle">48</text>
  <rect x="635" y="211" width="40" height="109" rx="4" fill="#9580ff" opacity="0.95"/>
  <text x="655" y="203" fill="#9580ff" font-size="11" font-weight="600" text-anchor="middle">78</text>
  <text x="632" y="348" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Sweden</text>

  <!-- Legend -->
  <g transform="translate(270, 410)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#66dbb5" opacity="0.85"/>
    <text x="26" y="14" fill="#ffffff" font-size="13">2010 (Recorded)</text>

    <rect x="170" y="0" width="18" height="18" rx="3" fill="#9580ff" opacity="0.95"/>
    <text x="196" y="14" fill="#ffffff" font-size="13">2025 (Projected)</text>
  </g>
</svg>