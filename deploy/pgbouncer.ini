;; Mockza Production PgBouncer Configuration (Transaction Pooling)
;; Optimized for high concurrency, zero connection exhaustion, and low memory footprint.

[databases]
mockza = host=postgres port=5432 dbname=mockza auth_user=mockza

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling ensures each HTTP request only holds a PG connection during active queries
pool_mode = transaction

;; Connection Limits
max_client_conn = 1000
default_pool_size = 30
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

;; Timeouts
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60

;; Low-level tuning
pkt_buf = 4096
max_packet_size = 2147483647
listen_backlog = 128
ignore_startup_parameters = extra_float_digits, application_name
application_name_add_host = 1
