name: Mockza Automated Multi-Flavor Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate_release_tag:
    name: Validate Semantic Versioning & Release Tag Integrity
    runs-on: ubuntu-24.04
    outputs:
      flavor: ${{ steps.parse_tag.outputs.flavor }}
      version: ${{ steps.parse_tag.outputs.version }}
      build_number: ${{ steps.parse_tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse release flavor and semantic version
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Processing release tag: $TAG"
          # Format: v1.0.0+10001.glb or v1.0.0+10001.irn
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\.(glb|irn)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "flavor=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
          else
            echo "Error: Tag $TAG does not match standard pattern v<semver>+<build>.<flavor>"
            exit 1
          fi

  build_android:
    name: Build Android Release App Bundle (.aab)
    needs: validate_release_tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read pinned Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Configure Release Signing & Build Android App Bundle (AAB)
        env:
          FLAVOR: ${{ needs.validate_release_tag.outputs.flavor }}
          BUILD_NAME: ${{ needs.validate_release_tag.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate_release_tag.outputs.build_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Error: Missing Android release signing secrets (ANDROID_KEYSTORE_*)." >&2
            exit 1
          fi
          cd app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          if [ "$FLAVOR" = "glb" ]; then
            TARGET="lib/main_global.dart"
            FLAVOR_NAME="global"
          elif [ "$FLAVOR" = "irn" ]; then
            TARGET="lib/main_iran.dart"
            FLAVOR_NAME="iran"
          else
            echo "Error: Unknown flavor $FLAVOR" >&2
            exit 1
          fi
          flutter pub get
          flutter build appbundle \
            --release \
            --flavor="$FLAVOR_NAME" \
            --target="$TARGET" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mockza-${{ needs.validate_release_tag.outputs.flavor }}-release-aab
          path: app/build/app/outputs/bundle/**/*.aab

  build_ios:
    name: Build iOS Archive (.xcarchive)
    needs: validate_release_tag
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Build iOS No-Codesign Archive
        env:
          FLAVOR: ${{ needs.validate_release_tag.outputs.flavor }}
          BUILD_NAME: ${{ needs.validate_release_tag.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate_release_tag.outputs.build_number }}
        run: |
          cd app
          if [ "$FLAVOR" = "glb" ]; then
            TARGET="lib/main_global.dart"
          elif [ "$FLAVOR" = "irn" ]; then
            TARGET="lib/main_iran.dart"
          else
            echo "Error: Unknown flavor $FLAVOR" >&2
            exit 1
          fi
          flutter pub get
          flutter build ipa \
            --release \
            --no-codesign \
            --target="$TARGET" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"
          tar -czf "build/ios/mockza-${FLAVOR}.xcarchive.tar.gz" -C build/ios/archive .

      - name: Archive iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: mockza-${{ needs.validate_release_tag.outputs.flavor }}-ios-xcarchive
          path: app/build/ios/mockza-${{ needs.validate_release_tag.outputs.flavor }}.xcarchive.tar.gz

  publish_backend_images:
    name: Build & Push Production Backend Docker Images (GHCR)
    needs: validate_release_tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Images
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          RAW_TAG: ${{ github.ref_name }}
        run: |
          DOCKER_TAG="${RAW_TAG//+/-}"
          for TARGET in api worker migrator cli; do
            IMAGE_NAME="$REGISTRY/mockza-$TARGET"
            echo "Building and pushing $IMAGE_NAME:$DOCKER_TAG"
            docker build \
              -f backend/Containerfile \
              --target "$TARGET" \
              -t "$IMAGE_NAME:$DOCKER_TAG" \
              -t "$IMAGE_NAME:latest" \
              backend
            docker push "$IMAGE_NAME:$DOCKER_TAG"
            docker push "$IMAGE_NAME:latest"
          done

  create_github_release:
    name: Create GitHub Release with SHA-256 Digest Manifest
    needs: [validate_release_tag, build_android, build_ios, publish_backend_images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums & Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          mapfile -t ARTIFACTS < <(find . -type f \( -name "*.aab" -o -name "*.tar.gz" -o -name "*.ipa" \) | sort)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "Error: No build artifacts found to publish." >&2
            exit 1
          fi
          sha256sum "${ARTIFACTS[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" \
            --title "Mockza Release ${{ github.ref_name }}" \
            --notes "Automated container-first release for Mockza. See attached build artifacts and SHA256SUMS.txt for verification." \
            SHA256SUMS.txt "${ARTIFACTS[@]}"
