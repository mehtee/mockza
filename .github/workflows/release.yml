name: Mockza Automated Multi-Flavor Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate_release_tag:
    name: Validate Semantic Versioning & Release Tag Integrity
    runs-on: ubuntu-24.04
    outputs:
      flavor: ${{ steps.parse_tag.outputs.flavor }}
      version: ${{ steps.parse_tag.outputs.version }}
      build_number: ${{ steps.parse_tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse release flavor and semantic version
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Processing release tag: $TAG"
          # Format: v1.0.0+10001.glb or v1.0.0+10001.irn
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\.(glb|irn)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "flavor=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
          else
            echo "Error: Tag $TAG does not match standard pattern v<semver>+<build>.<flavor>"
            exit 1
          fi

  build_android:
    name: Build Android Release App Bundle (.aab)
    needs: validate_release_tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read pinned Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Build Android App Bundle (AAB)
        env:
          FLAVOR: ${{ needs.validate_release_tag.outputs.flavor }}
          BUILD_NAME: ${{ needs.validate_release_tag.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate_release_tag.outputs.build_number }}
        run: |
          cd app
          TARGET="lib/main_${FLAVOR}.dart"
          if [ ! -f "$TARGET" ]; then
            TARGET="lib/main_global.dart"
          fi
          flutter pub get
          flutter build appbundle \
            --release \
            --target="$TARGET" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mockza-${{ needs.validate_release_tag.outputs.flavor }}-release.aab
          path: app/build/app/outputs/bundle/release/*.aab

  build_ios:
    name: Build iOS Archive & Unsigned IPA
    needs: validate_release_tag
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Flutter version
        id: flutter_version
        run: echo "version=$(cat .flutter-version)" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: 'stable'
          cache: true

      - name: Build iOS No-Codesign Archive
        env:
          FLAVOR: ${{ needs.validate_release_tag.outputs.flavor }}
          BUILD_NAME: ${{ needs.validate_release_tag.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate_release_tag.outputs.build_number }}
        run: |
          cd app
          TARGET="lib/main_${FLAVOR}.dart"
          if [ ! -f "$TARGET" ]; then
            TARGET="lib/main_global.dart"
          fi
          flutter pub get
          flutter build ipa \
            --release \
            --no-codesign \
            --target="$TARGET" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Archive iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: mockza-${{ needs.validate_release_tag.outputs.flavor }}-unsigned.ipa
          path: app/build/ios/archive/*.xcarchive

  publish_backend_images:
    name: Build & Push Production Backend Docker Images (GHCR)
    needs: validate_release_tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Images
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for TARGET in api worker migrator cli; do
            IMAGE_NAME="$REGISTRY/mockza-$TARGET"
            echo "Building and pushing $IMAGE_NAME:$TAG"
            docker build \
              -f backend/Containerfile \
              --target "$TARGET" \
              -t "$IMAGE_NAME:$TAG" \
              -t "$IMAGE_NAME:latest" \
              backend
            docker push "$IMAGE_NAME:$TAG"
            docker push "$IMAGE_NAME:latest"
          done

  create_github_release:
    name: Create GitHub Release with SHA-256 Digest Manifest
    needs: [validate_release_tag, build_android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums & Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          find . -type f -name "*.aab" -o -name "*.ipa" | while read file; do
            sha256sum "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" \
            --title "Mockza Release ${{ github.ref_name }}" \
            --notes "Automated container-first release for Mockza. See attached build artifacts and SHA256SUMS.txt for verification." \
            SHA256SUMS.txt
